name: CI
on:
  push:
    branches: [main, 'final/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile from declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: synchronize dependency lockfile"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    if: github.event_name == 'pull_request'
    needs: remediate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high --ignore-scripts

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Foundry version
        run: forge --version

      - name: Solidity compile
        run: forge build --sizes

      - name: Solidity unit and fuzz tests
        run: forge test -vvv

      - name: Type check
        run: npm run type-check

      - name: Regression tests
        run: npm test

      - name: Architecture truth check
        run: npm run architecture-truth

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: arctis-ci-build-only
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: arctis-ci
          OPENROUTER_API_KEY: arctis-ci-build-only
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: arctis-ci-build-only

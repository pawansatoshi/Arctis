name: CI
on:
  push:
    branches: [main, 'final/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high --ignore-scripts

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Foundry version
        run: forge --version

      - name: Solidity compile
        run: forge build --sizes

      - name: Solidity unit and fuzz tests
        run: forge test -vvv

      - name: Type check
        run: npm run type-check

      - name: Regression tests
        run: npm test

      - name: Architecture truth check
        run: npm run architecture-truth

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: arctis-ci-build-only
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: arctis-ci
          OPENROUTER_API_KEY: arctis-ci-build-only
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: arctis-ci-build-only

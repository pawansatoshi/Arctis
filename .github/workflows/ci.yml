name: CI
on:
  push:
    branches: [main, 'final/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Regression tests
        run: npm test
      - name: Architecture truth check
        run: npm run architecture-truth
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: arctis-ci-build-only
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: arctis-ci
          OPENROUTER_API_KEY: arctis-ci-build-only
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: arctis-ci-build-only
